# MEDIA: where uploads go
media:
  - name: uploads
    label: Зображення
    input: public/uploads
    output: /uploads
    categories: [image]

  - name: video
    label: Відео та постери
    input: public/uploads/video
    output: /uploads/video
    categories: [image, video]

  - name: brands
    label: Логотипи марок (SVG)
    input: public/uploads/brands
    output: /uploads/brands
    extensions: [svg]

# COMPONENTS: reusable field sets
components:
  # Background for hero and cta (the only places with video)
  backgroundMedia:
    type: object
    fields:
      - name: image
        label: Постер (картинка до завантаження відео)
        type: image
        options:
          media: video
          categories: [image]

      - name: video
        label: Відео для комп'ютера
        type: file
        options:
          media: video
          categories: [video]
          extensions: [mp4, webm]

      - name: mobileVideo
        label: Відео для телефону (до 767px)
        description: Необов'язково. Якщо порожньо, телефон показує звичайне відео.
        type: file
        options:
          media: video
          categories: [video]
          extensions: [mp4, webm]

      - name: alt
        label: Опис картинки
        description: Для екранних читачів. Для декоративного фону залиш порожнім.
        type: string

  # One working day in opening-hours.json
  workDay:
    type: object
    fields:
      - name: open
        label: Відкриваємось
        description: Формат 09:30. Порожньо = вихідний.
        type: string

      - name: close
        label: Зачиняємось
        description: Формат 19:00. Порожньо = вихідний.
        type: string

# CONTENT: sidebar in the editor
content:
  # GROUP 1: page sections (same order as on the page)

  - name: sections
    label: Контент сторінки
    type: group
    items:
      # Hero
      - name: hero
        label: Перший екран
        type: file
        path: src/content/hero.json
        fields:
          - name: headline
            label: Заголовок
            type: string
            required: true

          - name: headlineHighlight
            label: Виділена частина заголовка
            type: string
            required: true

          - name: headlineSecond
            label: Другий рядок заголовка
            type: string
            required: true

          - name: subtext
            label: Опис
            description: Підтримує {warranty}.
            type: text

          - name: background
            label: Фон (відео або картинка)
            component: backgroundMedia

          - name: primaryCta
            label: Головна кнопка
            type: string
            required: true

          - name: secondaryCta
            label: Друга кнопка
            type: string

      # Services
      - name: services
        label: Послуги та ціни
        type: file
        path: src/content/services.json
        fields:
          - name: eyebrow
            label: Малий надзаголовок
            type: string

          - name: headline
            label: Заголовок
            type: string
            required: true

          - name: priceNote
            label: Примітка до цін
            type: text

          - name: categories
            label: Категорії
            type: object
            list: true
            fields:
              - name: id
                label: Код категорії
                description: Латиницею, без пробілів, унікальний. Наприклад, brakes.
                type: string
                required: true

              - name: title
                label: Назва категорії
                type: string
                required: true

              - name: services
                label: Послуги
                type: object
                list: true
                fields:
                  - name: name
                    label: Назва послуги
                    type: string
                    required: true

                  - name: price
                    label: Ціна, грн
                    type: number
                    required: true

                  - name: from
                    label: Ціна "від"
                    type: boolean

      # Why choose us ---------------
      - name: why-choose
        label: Чому ми
        type: file
        path: src/content/why-choose.json
        fields:
          - name: eyebrow
            label: Малий надзаголовок
            type: string

          - name: headline
            label: Заголовок
            type: string
            required: true

          - name: lead
            label: Вступний текст
            description: Підтримує {cityLocative} і {experience}.
            type: text

          - name: image
            label: Картинка
            type: image
            options:
              media: uploads

          - name: imageAlt
            label: Опис картинки
            type: string

          - name: items
            label: Переваги
            type: object
            list: true
            fields:
              - name: icon
                label: Іконка
                type: select
                options:
                  values:
                    - { value: certified, label: Сертифікат }
                    - { value: quote, label: Кошторис }
                    - { value: warranty, label: Гарантія }
                    - { value: speed, label: Швидкість }

              - name: title
                label: Заголовок
                description: Підтримує {warranty}.
                type: string

              - name: description
                label: Опис
                description: Підтримує {warranty}.
                type: text

      # Brands
      - name: brands
        label: Марки авто
        type: file
        path: src/content/brands.json
        fields:
          - name: eyebrow
            label: Малий надзаголовок
            type: string

          - name: headline
            label: Заголовок
            type: string
            required: true

          - name: description
            label: Опис
            type: text

          - name: items
            label: Марки
            type: object
            list: true
            fields:
              - name: name
                label: Назва марки
                type: string
                required: true

              - name: logo
                label: Логотип (SVG)
                type: image
                options:
                  media: brands

      # CTA
      - name: cta
        label: Заклик до запису
        type: file
        path: src/content/cta.json
        fields:
          - name: eyebrow
            label: Малий надзаголовок
            type: string

          - name: headline
            label: Заголовок
            type: string
            required: true

          - name: subtext
            label: Опис
            type: text

          - name: background
            label: Фон (відео або картинка)
            component: backgroundMedia

          - name: primaryCta
            label: Головна кнопка
            type: string
            required: true

          - name: secondaryCta
            label: Друга кнопка
            type: string

      # Contacts (texts only; schedule is in settings)
      - name: hours
        label: Контакти (тексти розділу)
        type: file
        path: src/content/hours.json
        fields:
          - name: eyebrow
            label: Малий надзаголовок
            type: string

          - name: headline
            label: Заголовок
            type: string
            required: true

          - name: lead
            label: Опис
            description: Підтримує {address}.
            type: text

  # GROUP 2: settings (rarely changed)
  - name: settings
    label: Налаштування
    type: group
    items:
      # Site
      - name: site
        label: Загальні дані сайту
        type: file
        path: src/content/site.json
        fields:
          - name: brandPrefix
            label: Початок назви
            description: Наприклад, "СТО".
            type: string
            required: true

          - name: brandName
            label: Назва
            description: Наприклад, "Поршень".
            type: string
            required: true

          - name: city
            label: Місто
            type: string
            required: true

          - name: cityLocative
            label: Місто у місцевому відмінку ("у Львові")
            description: Підставляється у тексти як {cityLocative}.
            type: string
            required: true

          - name: phoneNumber
            label: Телефон
            description: У міжнародному форматі, наприклад +380668573564. З нього будуються лінки на дзвінок, Viber і Telegram.
            type: string
            required: true

          - name: address
            label: Адреса
            type: string
            required: true

          - name: mapEmbedUrl
            label: Вбудована карта (Embed)
            description: Поділитися > Вбудувати карту > скопіюй тільки адресу з src. Порожньо = простий пін за адресою.
            type: string
            required: true

          - name: mapUrl
            label: Посилання на місце в Google Maps
            description: Google Maps > знайти бізнес > Поділитися > Надіслати посилання. Порожньо = пошук за адресою.
            type: string

          - name: mapTarget
            label: Google Maps — адреса або координати
            description: Google Maps (Copy address) або координати наприклад 49.80699845634188, 24.05505852883552
            type: string

          - name: instagram
            label: Instagram (нік без @)
            description: Якщо порожньо, іконка не показується.
            type: string

          - name: warranty
            label: Гарантія
            description: Підставляється у тексти як {warranty}. Наприклад, "24 місяці".
            type: string
            required: true

          - name: experience
            label: Досвід
            description: Підставляється у тексти як {experience}. Наприклад, "10 років".
            type: string

          - name: navigation
            label: Меню
            type: object
            list: true
            fields:
              - name: href
                label: Якір розділу
                description: Наприклад, #services. Має збігатися з id розділу на сторінці.
                type: string

              - name: label
                label: Назва пункту
                type: string

          - name: footerAbout
            label: Короткий опис у футері
            type: text

          - name: booking
            label: Форма запису
            type: object
            required: true
            fields:
              - name: title
                label: Заголовок
                type: string
                required: true

              - name: intro
                label: Вступний текст
                type: text
                required: true

      # Opening hours (7 fixed days, empty = closed) --
      - name: opening-hours
        label: Графік роботи
        type: file
        path: src/content/opening-hours.json
        fields:
          - { name: mon, label: Понеділок, component: workDay }
          - { name: tue, label: Вівторок, component: workDay }
          - { name: wed, label: Середа, component: workDay }
          - { name: thu, label: Четвер, component: workDay }
          - { name: fri, label: "П'ятниця", component: workDay }
          - { name: sat, label: Субота, component: workDay }
          - { name: sun, label: Неділя, component: workDay }

      # SEO (to be reworked later) --
      - name: seo
        label: SEO і прев'ю у соцмережах
        type: file
        path: src/content/seo.json
        fields:
          - name: language
            label: Мова сторінки
            type: string

          - name: title
            label: Заголовок сторінки
            description: Підтримує {name} і {city}.
            type: string

          - name: description
            label: Опис для пошуку
            description: Підтримує {name}, {city} і {phone}.
            type: text

          - name: canonicalUrl
            label: Канонічне посилання
            description: Порожньо = адреса поточної сторінки.
            type: string

          - name: robots
            label: Індексація
            type: string

          - name: themeColor
            label: Колір браузера
            type: string

          - name: favicon
            label: Іконка сайту
            type: string

          - name: appleTouchIcon
            label: Іконка для iPhone
            type: string

          - name: openGraph
            label: Прев'ю у соцмережах
            type: object
            fields:
              - name: locale
                label: Локаль
                type: string

              - name: type
                label: Тип
                type: string

              - name: siteName
                label: Назва сайту
                description: Підтримує {name}.
                type: string

              - name: title
                label: Заголовок
                description: Порожньо = заголовок сторінки.
                type: string

              - name: description
                label: Опис
                description: Порожньо = опис для пошуку.
                type: text

              - name: image
                label: Картинка
                type: image
                options:
                  media: uploads

              - name: imageAlt
                label: Опис картинки
                type: string

          - name: twitter
            label: Прев'ю в X (Twitter)
            type: object
            fields:
              - name: card
                label: Тип картки
                type: string

              - name: title
                label: Заголовок
                description: Порожньо = заголовок прев'ю.
                type: string

              - name: description
                label: Опис
                description: Порожньо = опис прев'ю.
                type: text

              - name: image
                label: Картинка
                description: Порожньо = картинка прев'ю.
                type: image
                options:
                  media: uploads
