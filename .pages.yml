# MEDIA: where uploads go
media:
  - name: uploads
    label: Зображення
    input: public/uploads
    output: /uploads
    categories: [image]

  - name: video
    label: Відео та постери
    input: public/uploads/video
    output: /uploads/video
    categories: [image, video]

  - name: brands
    label: Логотипи марок (SVG)
    input: public/uploads/brands
    output: /uploads/brands
    extensions: [svg]

# COMPONENTS: reusable field sets
components:
  backgroundMedia:
    type: object
    fields:
      - name: image
        label: Відео Постер
        type: image
        options:
          media: video
          categories: [image]

      - name: video
        label: Відео для desktop
        type: file
        options:
          media: video
          categories: [video]
          extensions: [mp4, webm]

      - name: mobileVideo
        label: Відео для mobile
        description: Необов'язково.
        type: file
        options:
          media: video
          categories: [video]
          extensions: [mp4, webm]

      - name: alt
        label: SEO Alt
        type: string

  workDay:
    type: object
    fields:
      - name: schedule
        label: Графік
        description: 'Наприклад: 09:30-19:00. Порожньо - вихідний.'
        type: string

# CONTENT: sidebar in the editor
content:
  - name: sections
    label: Контент сторінки
    type: group
    items:
      - name: hero
        label: Перший екран
        type: file
        path: src/content/hero.json
        fields:
          - name: headline
            label: Заголовок
            type: string
            required: true

          - name: headlineHighlight
            label: Виділена частина заголовка
            type: string
            required: true

          - name: headlineSecond
            label: Продовження заголовка
            type: string
            required: true

          - name: subtext
            label: Опис
            type: text

          - name: background
            label: Фон (відео або картинка)
            component: backgroundMedia

          - name: primaryCta
            label: Головна кнопка
            type: string
            required: true

          - name: secondaryCta
            label: Друга кнопка
            type: string

      - name: services
        label: Послуги та ціни
        type: file
        path: src/content/services.json
        fields:
          - name: eyebrow
            label: Надзаголовок
            type: string

          - name: headline
            label: Заголовок
            type: string
            required: true

          - name: priceNote
            label: Примітка до цін
            type: text

          - name: categories
            label: Категорії
            type: object
            list: true
            fields:
              - name: title
                label: Категорія
                type: string
                required: true

              - name: services
                label: Послуги
                type: object
                list: true
                fields:
                  - name: name
                    label: Послуга
                    type: string
                    required: true

                  - name: price
                    label: Ціна, грн
                    type: number
                    required: true

                  - name: from
                    label: Ціна від
                    type: boolean

      - name: why-choose
        label: Чому ми
        type: file
        path: src/content/why-choose.json
        fields:
          - name: eyebrow
            label: Надзаголовок
            type: string

          - name: headline
            label: Заголовок
            type: string
            required: true

          - name: lead
            label: Опис
            type: text

          - name: image
            label: Картинка
            type: image
            options:
              media: uploads

          - name: imageAlt
            label: SEO Alt
            type: string

          - name: items
            label: Переваги
            type: object
            list: true
            fields:
              - name: iconName
                label: Іконка
                type: select
                options:
                  values:
                    - { value: certified, label: Сертифікат }
                    - { value: quote, label: Кошторис }
                    - { value: warranty, label: Гарантія }
                    - { value: speed, label: Швидкість }

              - name: title
                label: Заголовок
                type: string

              - name: description
                label: Опис
                type: text

      - name: brands
        label: Марки авто
        type: file
        path: src/content/brands.json
        fields:
          - name: eyebrow
            label: Надзаголовок
            type: string

          - name: headline
            label: Заголовок
            type: string
            required: true

          - name: description
            label: Опис
            type: text

          - name: items
            label: Марки
            type: object
            list: true
            fields:
              - name: name
                label: Назва марки
                type: string
                required: true

              - name: logo
                label: Логотип (SVG)
                type: image
                options:
                  media: brands

      - name: cta
        label: Заклик до запису
        type: file
        path: src/content/cta.json
        fields:
          - name: eyebrow
            label: Надзаголовок
            type: string

          - name: headline
            label: Заголовок
            type: string
            required: true

          - name: subtext
            label: Опис
            type: text

          - name: background
            label: Фон
            component: backgroundMedia

          - name: primaryCta
            label: Основна кнопка
            type: string
            required: true

          - name: secondaryCta
            label: Друга кнопка
            type: string

      - name: hours
        label: Контакти
        type: file
        path: src/content/hours.json
        fields:
          - name: eyebrow
            label: Надзаголовок
            type: string

          - name: headline
            label: Заголовок
            type: string
            required: true

          - name: lead
            label: Опис
            type: text

  - name: settings
    label: Налаштування
    type: group
    items:
      - name: site
        label: Сайт
        type: file
        path: src/content/site.json
        fields:
          - name: brandPrefix
            label: Префікс назви
            description: 'Наприклад: СТО.'
            type: string
            required: true

          - name: brandName
            label: Назва
            description: 'Наприклад: Поршень.'
            type: string
            required: true

          - name: city
            label: Місто
            type: string
            required: true

          - name: phoneNumber
            label: Телефон
            description: 'Формат: +380668573564.'
            type: string
            required: true

          - name: address
            label: Адреса
            type: string
            required: true

          - name: mapEmbedUrl
            label: Карта embed
            description: Встав адресу з атрибута src.
            type: string
            required: true

          - name: mapUrl
            label: Посилання на Google Maps
            description: Порожньо - пошук за адресою.
            type: string

          - name: mapTarget
            label: Адреса або координати
            description: Для карти, якщо немає embed.
            type: string

          - name: instagram
            label: Instagram
            description: Якщо порожньо, іконка не показується.
            type: string

          - name: navigation
            label: Меню
            type: object
            list: true
            fields:
              - name: sectionId
                label: ID розділу
                description: 'Наприклад: services. Має збігатися з ID на сторінці.'
                type: string

              - name: label
                label: Назва пункту
                type: string

          - name: footerAbout
            label: Опис у footer
            type: text

          - name: booking
            label: Форма запису
            type: object
            required: true
            fields:
              - name: title
                label: Заголовок
                type: string
                required: true

              - name: intro
                label: Вступний текст
                type: text
                required: true

      - name: opening-hours
        label: Графік роботи
        type: file
        path: src/content/opening-hours.json
        fields:
          - { name: weekdays, label: Пн-Пт, component: workDay }
          - { name: sat, label: Субота, component: workDay }
          - { name: sun, label: Неділя, component: workDay }

      # SEO
      - name: seo
        label: SEO і прев'ю у соцмережах
        type: file
        path: src/content/seo.json
        fields:
          - name: siteUrl
            label: URL сайту
            description: Основна адресу з "https:// і кінцевим /" для canonical і schema.
            type: string

          - name: title
            label: Заголовок сторінки
            type: string

          - name: description
            label: Опис для пошуку
            type: text

          - name: brandImage
            label: Логотип
            type: image
            options:
              media: uploads

          - name: favicon
            label: Іконка сайту
            type: string

          - name: verification
            label: Підтвердження сайту
            type: object
            fields:
              - name: google
                label: Google
                type: string

              - name: bing
                label: Bing
                type: string

          # Social sharing preview
          - name: openGraph
            label: Прев'ю у соцмережах
            type: object
            fields:
              - name: image
                label: Картинка
                type: image
                options:
                  media: uploads

      # Business search details
      - name: schema
        label: Структуровані дані
        type: object
        fields:
          - name: type
            label: Тип бізнесу
            type: string

          - name: description
            label: Опис бізнесу
            type: text

          - name: priceRange
            label: Рівень цін
            type: string

          - name: currency
            label: Валюта
            type: string

          - name: sameAs
            label: Соцмережі бізнесу
            type: string
            list: true
